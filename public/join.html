<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>BuzzIn</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="player">
    <div id="top" class="top"><div id="topName" class="top-name">BuzzIn</div><div id="topTeam" class="top-team"></div></div>
    <main>
      <form id="nameForm" class="hidden">
        <img class="hero-mark small" src="/logo.svg" alt="">
        <div id="joining" class="joining"></div>
        <h2>What's your name?</h2>
        <input id="nameInput" maxlength="20" autocomplete="off" placeholder="e.g. Priya" required>
        <button type="submit" style="width:100%">Join</button>
      </form>

      <div id="message" class="status hidden"></div>

      <div id="sparkle" class="hidden">
        <div id="spHead" class="status"></div>
        <div id="spBig" class="secret"></div>
        <div id="spTimer" class="timer"></div>
      </div>

      <div id="game" class="hidden">
        <div id="doubleNote" class="double-note hidden">💥 DOUBLE! Worth 2×</div>
        <button id="buzz" disabled>BUZZ</button>
        <div id="status" class="status"></div>
      </div>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/join.js"></script>
</body>
</html>
