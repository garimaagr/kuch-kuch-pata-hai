<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>BuzzIn</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="player">
    <div id="top" class="top"><div id="topName" class="top-name">BuzzIn</div><div id="topTeam" class="top-team"></div></div>
    <main>
      <form id="nameForm" class="hidden">
        <img class="hero-mark small" src="/logo.svg" alt="">
        <div id="joining" class="joining"></div>
        <h2>What's your name?</h2>
        <input id="nameInput" maxlength="20" autocomplete="off" placeholder="e.g. Priya" required>
        <button type="submit" style="width:100%">Join</button>
      </form>

      <div id="message" class="status hidden"></div>

      <div id="sparkle" class="hidden">
        <div id="spHead" class="status"></div>
        <div id="spBig" class="secret"></div>
        <div id="spTimer" class="timer"></div>
        <!-- No host: the performer and the voters play from here -->
        <div id="nhSpCount" class="nh-phone-count hidden"></div>
        <button id="nhGuessed" class="nh-big good hidden">🎉 Guessed!</button>
        <button id="nhMimicDone" class="nh-big hidden">✅ Done</button>
        <div id="nhMimicVote" class="nh-row hidden">
          <button data-mimic="lol">😂<small>+100</small></button>
          <button data-mimic="smile">🙂<small>+50</small></button>
          <button data-mimic="meh">😐<small>+25</small></button>
        </div>
      </div>

      <div id="game" class="hidden">
        <div id="doubleNote" class="double-note hidden">💥 DOUBLE! Worth 2×</div>
        <button id="buzz" disabled>BUZZ</button>
        <div id="status" class="status"></div>
        <!-- No host: countdowns, your own answer check, challenges and votes -->
        <div id="nhCount" class="nh-phone-count hidden"></div>
        <div id="nhAnswer" class="nh-answer hidden"></div>
        <div id="nhJudge" class="nh-row hidden">
          <button id="nhGot" class="good">✅ I got it</button>
          <button id="nhMissed" class="bad">❌ I missed it</button>
        </div>
        <button id="nhChallenge" class="nh-big bad hidden">🚩 Challenge</button>
        <button id="nhPass" class="nh-big secondary hidden">🙅 Pass</button>
        <div id="nhBoard" class="nh-board hidden" role="grid" aria-label="Pick the next tile"></div>
        <div id="nhBonus" class="nh-row hidden">
          <button data-bonus="up">👍</button>
          <button data-bonus="down">👎</button>
        </div>
        <div id="nhFunny" class="nh-funny hidden"></div>
      </div>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/join.js"></script>
</body>
</html>
